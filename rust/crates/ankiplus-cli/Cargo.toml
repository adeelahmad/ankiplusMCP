[package]
name = "ankiplus-cli"
description = "Command line for the Rust AnkiPlus matching pipeline"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "ankiplus"
path = "src/main.rs"

[features]
default = []
embed = ["ankiplus-match/embed"]
postgres = ["ankiplus-match/postgres"]
pdf = ["ankiplus-match/pdf"]
full = ["embed", "postgres", "pdf"]

[dependencies]
ankiplus-match.workspace = true
serde_json.workspace = true
serde.workspace = true
clap = { version = "4", features = ["derive"] }
