name: Desktop installers

# Unsigned AnkiPlus installers (.dmg for macOS, .exe for Windows) as workflow artifacts.
# The app bundles uv, which fetches Python and the MCP server on first use, and the ONNX
# runtime; the search model downloads on first run. Signing and notarization need the
# owner's Apple and Windows certificates, so these builds are unsigned (see
# rust/docs/install-unsigned.md for the one-time right-click > Open step).

# Every build is tested from the installer itself (the installed app's --self-test, then the
# MCP server it registers is started once with the bundled uv). When all pass, the
# installers are published as a GitHub pre-release (the workflow creates the tag, since
# tags cannot be pushed from the build environment), so they download without a login.

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths: ["rust/**", "package.json", ".github/workflows/desktop-release.yml"]

permissions:
  contents: read

# Installers take a while; a newer push waits for the running build instead of cancelling it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_VERSION: "0.11.32"

jobs:
  installer:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, bundle: dmg, uv: uv-aarch64-apple-darwin.tar.gz, name: AnkiPlus-macOS-AppleSilicon, features: "embed,pdf" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, bundle: nsis, uv: uv-x86_64-pc-windows-msvc.zip, name: AnkiPlus-Windows, features: "embed,pdf" }
    # No Intel Mac build: ONNX Runtime ships no x86_64 macOS binaries, and current
    # cryptography/pymupdf wheels for the server are arm64-only on macOS, so the server
    # would have to compile from source on the student's Mac.
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: rust/app/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: installer-${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bundle uv as the app's sidecar
        run: |
          mkdir -p binaries dl
          curl -fsSL -o "dl/${{ matrix.uv }}" "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/${{ matrix.uv }}"
          case "${{ matrix.uv }}" in
            *.zip) unzip -q -o "dl/${{ matrix.uv }}" -d dl/x && cp dl/x/uv.exe "binaries/uv-${{ matrix.target }}.exe" ;;
            *) tar -xzf "dl/${{ matrix.uv }}" -C dl && cp dl/*/uv "binaries/uv-${{ matrix.target }}" && chmod +x "binaries/uv-${{ matrix.target }}" ;;
          esac
          ls -l binaries
      - name: Build the installer
        # ONNX Runtime's macOS objects call ___isPlatformVersionAtLeast (compiler-rt), which
        # rustc's -nodefaultlibs link leaves out once a deployment target is set.
        run: |
          if [ "$RUNNER_OS" = macOS ]; then export RUSTFLAGS="-C link-arg=$(xcrun clang --print-runtime-dir)/libclang_rt.osx.a"; fi
          npx --yes @tauri-apps/cli@2 build --target ${{ matrix.target }} --bundles ${{ matrix.bundle }} --config tauri.release.conf.json --features ${{ matrix.features }}
      - name: Test the installed app (macOS)
        if: runner.os == 'macOS'
        run: |
          dmg=$(find ../../target/${{ matrix.target }}/release/bundle/dmg -name '*.dmg' | head -1)
          hdiutil attach -nobrowse -mountpoint /tmp/ankiplus "$dmg"
          app=$(find /tmp/ankiplus -maxdepth 1 -name '*.app' | head -1)
          ls -l "$app/Contents/MacOS"
          codesign -dv "$app" 2>&1 | head -5 || true
          main=$(find "$app/Contents/MacOS" -type f -perm -u+x ! -name 'uv*' | head -1)
          "$main" --self-test "$GITHUB_WORKSPACE/tests/fixtures/match/synthetic_anking.json" /tmp/self-test.json
          cat /tmp/self-test.json
          uv="$app/Contents/MacOS/uv"
          python3 -c "import json,sys; r=json.load(open('/tmp/self-test.json')); sys.exit(0 if r['ok'] and r['uv_path'].endswith('Contents/MacOS/uv') else 1)"
          spec=$(python3 -c "import json; print(json.load(open('/tmp/self-test.json'))['server_spec'])")
          py=$(python3 -c "import json; print(json.load(open('/tmp/self-test.json'))['python'])")
          # doctor exits non-zero when an optional tool (e.g. tesseract) is missing; required ones must be ok.
          "$uv" tool run --python "$py" --from "$spec" ankiplusmcp doctor --json > /tmp/doctor.json || true
          cat /tmp/doctor.json
          python3 -c "import json,sys; d=json.load(open('/tmp/doctor.json')); bad=[c['name'] for c in d['checks'] if c['required'] and c['status']!='ok']; print('required missing:', bad); sys.exit(1 if bad else 0)"
          hdiutil detach /tmp/ankiplus
      - name: Test the installed app (Windows)
        if: runner.os == 'Windows'
        run: |
          setup=$(find ../../target/${{ matrix.target }}/release/bundle/nsis -name '*-setup.exe' | head -1)
          "$setup" //S
          sleep 5
          dir="$LOCALAPPDATA/AnkiPlus"
          ls -l "$dir"
          main=$(find "$dir" -maxdepth 1 -iname '*.exe' ! -iname 'uv*' ! -iname 'uninstall*' | head -1)
          "$main" --self-test "$GITHUB_WORKSPACE/tests/fixtures/match/synthetic_anking.json" "$RUNNER_TEMP/self-test.json"
          cat "$RUNNER_TEMP/self-test.json"
          python -c "import json,sys; r=json.load(open(r'$RUNNER_TEMP/self-test.json')); sys.exit(0 if r['ok'] and r['uv_path'] else 1)"
          spec=$(python -c "import json; print(json.load(open(r'$RUNNER_TEMP/self-test.json'))['server_spec'])")
          py=$(python -c "import json; print(json.load(open(r'$RUNNER_TEMP/self-test.json'))['python'])")
          "$dir/uv.exe" tool run --python "$py" --from "$spec" ankiplusmcp doctor --json > "$RUNNER_TEMP/doctor.json" || true
          cat "$RUNNER_TEMP/doctor.json"
          python -c "import json,sys; d=json.load(open(r'$RUNNER_TEMP/doctor.json')); bad=[c['name'] for c in d['checks'] if c['required'] and c['status']!='ok']; print('required missing:', bad); sys.exit(1 if bad else 0)"
      - name: Collect
        run: |
          mkdir -p ../../../dist-installer
          find ../../target/${{ matrix.target }}/release/bundle \( -name '*.dmg' -o -name '*-setup.exe' \) -exec cp {} ../../../dist-installer/ \;
          ls -l ../../../dist-installer
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist-installer/
          if-no-files-found: error
          retention-days: 30

  release:
    needs: installer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Version
        id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v${{ steps.v.outputs.version }}-test.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: AnkiPlus desktop ${{ steps.v.outputs.version }} (test build ${{ github.run_number }})
          prerelease: true
          body_path: rust/docs/install-unsigned.md
          files: dist/*
          fail_on_unmatched_files: true
