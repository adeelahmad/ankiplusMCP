name: Rust

on:
  push:
    branches: ["**"]
    paths: ["rust/**", "src/ankiplusmcp/match/**", "tests/fixtures/match/**", ".github/workflows/rust.yml"]
  pull_request:
    paths: ["rust/**", "src/ankiplusmcp/match/**", "tests/fixtures/match/**", ".github/workflows/rust.yml"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: rust

jobs:
  test-and-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Core tests
        run: cargo test
      - name: Python vs Rust parity (embeddings off)
        run: |
          cargo build -p ankiplus-cli
          python -m pip install -e ..
          python scripts/parity.py

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: WebKitGTK
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev
      - name: Build CLI and desktop app with all features
        run: cargo build -p ankiplus-cli -p ankiplus-desktop --features full
